name: Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its unfinished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tables, fenced code, and a header's description are exempt: they cannot be wrapped. A CRLF
      # line ending is not counted, so a checkout on Windows gives the same result.
      - name: Markdown lines within 100 characters
        run: |
          find . -name '*.md' -not -path './.git/*' -print0 | xargs -0 perl -CSD -ne '
            chomp; s/\r\z//;
            if (/^\s*```/) { $fence = !$fence }
            elsif (!$fence && !/^\s*\|/ && !/^description: "/ && length > 100) {
              print "$ARGV:$.: ", length, " characters\n"; $bad = 1;
            }
            if (eof) { close ARGV; $fence = 0 }
            END { exit $bad }'
      # Every session reads the contract and the entrypoint before acting, so their length is a cost
      # paid on every task.
      - name: Contract within its word caps
        run: |
          contract=$(wc -w < OPERATING.md)
          start=$(cat OPERATING.md templates/workbench-entrypoint.md | wc -w)
          echo "OPERATING.md: $contract words (cap 600); with the entrypoint: $start (cap 700)"
          [ "$contract" -le 600 ] && [ "$start" -le 700 ]
      # A host drops a skill whose header it cannot parse, without a warning, and reads a skill in
      # full whenever a request matches it.
      - name: Skills have a loadable header and stay short
        run: |
          bad=0
          for f in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$f")")
            [ "$(sed -n 1p "$f")" = "---" ] || { echo "$f: no header"; bad=1; }
            [ "$(sed -n 2p "$f")" = "name: $name" ] || { echo "$f: name is not $name"; bad=1; }
            sed -n 3p "$f" | grep -Eq '^description: "[^"]{20,1000}"$' ||
              { echo "$f: description is not one quoted line"; bad=1; }
            [ "$(sed -n 4p "$f")" = "---" ] || { echo "$f: header has other lines"; bad=1; }
            words=$(wc -w < "$f")
            [ "$words" -le 600 ] || { echo "$f: $words words (cap 600)"; bad=1; }
          done
          exit $bad
      - name: Relative links resolve
        run: |
          find . -name '*.md' -not -path './.git/*' -print0 | xargs -0 perl -CSD -ne '
            while (/\]\(([^)\s#]+)/g) {
              my $target = $1;
              next if $target =~ /^[a-z][a-z0-9+.-]*:/i;
              (my $dir = $ARGV) =~ s{/[^/]*$}{};
              unless (-e "$dir/$target") { print "$ARGV:$.: missing $target\n"; $bad = 1 }
            }
            close ARGV if eof;
            END { exit $bad }'
